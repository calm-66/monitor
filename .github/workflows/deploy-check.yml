name: Deploy Check

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

concurrency:
  group: deploy-check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate-and-build:
    name: Migrate database and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Select database URL
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "DATABASE_URL=${{ secrets.PROD_DATABASE_URL }}" >> "$GITHUB_ENV"
          elif [ "${GITHUB_REF_NAME}" = "dev" ]; then
            echo "DATABASE_URL=${{ secrets.DEV_DATABASE_URL }}" >> "$GITHUB_ENV"
          else
            echo "Unsupported branch for database migrations: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          echo "DASHBOARD_PASSWORD=${{ secrets.DASHBOARD_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Run database migrations
        run: npm run db:deploy

      - name: Build
        run: npm run build
